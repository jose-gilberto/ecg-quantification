[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-quantification"
version = "0.1.0"
description = "Clinically-relevant prevalence protocols and tools for ECG beat quantification, built on quack."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Gilberto Medeiros", email = "medeiros.gilberto.br@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "quack @ git+https://github.com/jose-gilberto/quack@main",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "wfdb>=4.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]