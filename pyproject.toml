[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-quantification"
version = "0.1.0"
description = "Clinically-relevant prevalence protocols and tools for ECG beat quantification, built on quack."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gilberto Medeiros", email = "medeiros.gilberto.br@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Pinned to a specific commit (not @main) for experiment reproducibility:
    # quack's main branch pins very recent scikit-learn/numpy/pandas/scipy
    # itself, so an unpinned dependency here could silently shift the whole
    # stack's floor (and Python version requirement) out from under a
    # published paper's environment. Bump deliberately, not accidentally.
    "quack @ git+https://github.com/jose-gilberto/quack@develop",
    # Floors below so pip's resolver doesn't have to backtrack across
    # dozens of scikit-learn/numpy releases before discovering the real
    # constraint -- and so a Python version too old for quack (<3.11,
    # since scikit-learn>=1.8 requires it) fails fast with a clear "no
    # matching Python" message instead of a confusing "conflicting
    # dependencies" one.
    #
    # numpy is capped below 2.5.0 (not just floored) because the optional
    # `deep` extra's aeon==1.6.0 pins numpy<2.5.0,>=2.0.0 -- an
    # unconstrained-above floor here (numpy>=2.5.0, this project's
    # earlier setting) makes `pip install -e ".[deep]"` unresolvable
    # (ResolutionImpossible) even though a plain `pip install -e "."`
    # looks fine on its own. Kept as a base-package constraint (rather
    # than only inside the `deep` extra) since pip has no way to loosen
    # an already-declared dependency's range only for some extras; the
    # intersection has to hold for every install of this project,
    # deep-extra or not. scikit-learn/scipy floors already happened to
    # fall inside aeon's own upper bounds (<1.10.0 and <1.18.0
    # respectively) and needed no change when this was discovered.
    "numpy>=2.0.0,<2.5.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.0",
    "pandas>=3.0.3",
    "wfdb>=4.1",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Deep-learning classifier adapters (LITETimeClassifier now; ECGFounder
# later) pull in heavyweight backends (TensorFlow for aeon's LITETime,
# likely PyTorch for ECGFounder). Kept optional -- importing
# ecg_quantification.quantifiers must not force a multi-hundred-MB
# install on users who only need the sklearn-based quantifiers, and
# _lite_time.py defers its `aeon`/`tensorflow` import accordingly (see
# that module's docstring).
deep = [
    "aeon>=1.6",
    "tensorflow-cpu>=2.16; sys_platform != 'darwin'",
    "tensorflow>=2.16; sys_platform == 'darwin'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # joblib's numpy_pickle internals set `.shape` on an ndarray, deprecated
    # as of numpy>=2.5; this is entirely inside joblib (triggered by
    # ExperimentCheckpoint's joblib.dump/load), not something our own code
    # can fix. Safe to ignore until joblib ships a fix upstream. Dormant
    # now that numpy is capped below 2.5.0 (see the `numpy` dependency
    # comment above) -- left in place in case that cap is ever loosened.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib",
    # aeon's LITETimeClassifier.load_model() (used by _load_lite_time when
    # persist=True) reloads a Keras checkpoint saved mid-training, whose
    # optimizer had already accumulated Adam moment-estimate variables;
    # the freshly-deserialized optimizer starts without them. This is
    # expected -- we only ever use loaded models for inference, never to
    # resume .fit() -- and is entirely inside keras/aeon, not our code.
    "ignore:Skipping variable loading for optimizer:UserWarning:keras",
]